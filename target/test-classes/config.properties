# ---------- Application ----------
base.url=https://maiukha-preview.pages.dev
login.path=/login
signup.path=/signup
# A page that needs login. Change it if the real dashboard URL is different.
protected.path=/dashboard

# ---------- Browser ----------
# chromium | firefox | webkit | chrome | edge
browser=chromium
headless=false
slowmo=300
# default timeout in milliseconds
timeout=15000

# ---------- Valid account (OPTIONAL - ask your team for a test account) ----------
# Leave blank and the tests that need it are SKIPPED, not failed.
valid.email=
valid.password=

# ---------- Performance thresholds (milliseconds) ----------
max.load.time=5000
max.page.weight.kb=3072
max.requests=100